
name: Deploy Sat Hach Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-sat-hach-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Sat Hach
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VPS_HOST: "163.61.182.214"
      VPS_USER: "root"
      VPS_PORT: "22"

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH known hosts
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          ssh-keyscan \
            -p "$VPS_PORT" \
            -H "$VPS_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy
        env:
          SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail

          sshpass -p "$SSH_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE'

          set -Eeuo pipefail

          PROJECT_DIR="/root/sat-hach-platform"
          BRANCH="main"
          COMPOSE_FILE="docker-compose.server.yml"
          ENV_FILE=".env.server"

          compose() {
            docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" \
              "$@"
          }

          on_error() {
            status=$?
            trap - ERR

            echo ""
            echo "========================================"
            echo "SAT HACH DEPLOY FAILED"
            echo "Exit status: $status"
            echo "========================================"

            if [ -d "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR" || true

              if [ -f "$ENV_FILE" ] && [ -f "$COMPOSE_FILE" ]; then
                compose ps -a || true

                echo "==> API logs"
                compose logs --tail=150 api || true

                echo "==> Web logs"
                compose logs --tail=150 web || true

                echo "==> PostgreSQL logs"
                compose logs --tail=80 postgres || true

                echo "==> Redis logs"
                compose logs --tail=80 redis || true
              fi
            fi

            exit "$status"
          }

          trap on_error ERR

          echo "========================================"
          echo "DEPLOY SAT HACH PLATFORM"
          echo "========================================"

          test -d "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          test -d .git

          echo "==> Fetch latest source"

          git fetch --prune origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          echo "==> Current commit"
          git log -1 --oneline

          echo "==> Validate files"

          test -f "$ENV_FILE"
          test -f "$COMPOSE_FILE"
          test -f Dockerfile.server
          test -f package.json
          test -f pnpm-lock.yaml

          echo "==> Validate required environment variables"

          for key in \
            DB_USERNAME \
            DB_PASSWORD \
            DB_DATABASE \
            JWT_ACCESS_SECRET \
            JWT_REFRESH_SECRET \
            SUPER_ADMIN_USERNAME \
            SUPER_ADMIN_PASSWORD \
            NEXT_PUBLIC_API_URL
          do
            if ! grep -q "^${key}=." "$ENV_FILE"; then
              echo "Missing environment variable: $key"
              exit 1
            fi
          done

          echo "==> Validate Docker Compose"

          compose config --quiet

          echo "==> Check service definitions"

          for service in postgres redis migrate api web; do
            compose --profile tools config --services \
              | grep -qx "$service" || {
                echo "Missing service: $service"
                exit 1
              }
          done

          echo "========================================"
          echo "BUILD APPLICATION IMAGE"
          echo "========================================"

          compose build api

          echo "========================================"
          echo "START NEW DATABASE AND REDIS"
          echo "========================================"

          compose up -d --wait postgres redis

          echo "========================================"
          echo "RUN DATABASE MIGRATIONS"
          echo "========================================"

          compose run --rm -T migrate </dev/null

          echo "========================================"
          echo "START API AND WEB"
          echo "========================================"

          compose up -d --no-build api web

          echo "========================================"
          echo "HEALTH CHECK"
          echo "========================================"

          read_env_value() {
            key="$1"
            grep "^${key}=" "$ENV_FILE" \
              | tail -1 \
              | cut -d= -f2- \
              | tr -d '\r' \
              || true
          }

          API_PORT="$(read_env_value API_PUBLIC_PORT)"
          WEB_PORT="$(read_env_value WEB_PUBLIC_PORT)"

          API_PORT="${API_PORT:-8000}"
          WEB_PORT="${WEB_PORT:-8001}"

          wait_http() {
            name="$1"
            url="$2"

            for attempt in $(seq 1 45); do
              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                "$url" \
                >/dev/null 2>&1
              then
                echo "$name is ready"
                return 0
              fi

              echo "Waiting for $name: $attempt/45"
              sleep 2
            done

            echo "$name failed health check"
            return 1
          }

          wait_http \
            "API" \
            "http://127.0.0.1:${API_PORT}/api/health"

          wait_http \
            "WEB" \
            "http://127.0.0.1:${WEB_PORT}/login"

          echo "========================================"
          echo "FINAL STATUS"
          echo "========================================"

          compose ps -a

          echo "==> Cleanup dangling images"
          docker image prune -f

          trap - ERR

          echo "========================================"
          echo "SAT HACH DEPLOY SUCCESS"
          echo "========================================"

          REMOTE
