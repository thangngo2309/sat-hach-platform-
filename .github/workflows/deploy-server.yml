name: Deploy Sat Hach Server

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-sat-hach-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Sat Hach
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # =====================================================
      # CHECKOUT REPOSITORY
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # INSTALL SSHPASS
      # =====================================================
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # =====================================================
      # DEPLOY TO VPS
      # =====================================================
      - name: Deploy Sat Hach
        env:
          VPS_HOST: 163.61.182.214
          VPS_USER: root
          VPS_PORT: "22"
          VPS_PASS: ${{ secrets.VPS_SSH_PASSWORD }}

        run: |
          set -Eeuo pipefail

          sshpass -p "$VPS_PASS" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE'

          set -Eeuo pipefail

          # =================================================
          # CONFIGURATION
          # =================================================
          PROJECT_DIR="/root/sat-hach-platform-"
          BRANCH="main"
          COMPOSE_FILE="docker-compose.server.yml"
          ENV_FILE=".env.server"

          API_CONTAINER="sathach-api"
          WEB_CONTAINER="sathach-web"
          DB_CONTAINER="sathach-postgres"
          REDIS_CONTAINER="sathach-redis"

          API_PORT=8000
          WEB_PORT=8001

          # =================================================
          # DOCKER COMPOSE HELPER
          # =================================================
          compose() {
            docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" \
              "$@"
          }

          # =================================================
          # ERROR HANDLER
          # =================================================
          on_error() {
            EXIT_CODE=$?
            trap - ERR

            echo ""
            echo "========================================"
            echo "SAT HACH DEPLOY FAILED"
            echo "Exit code: $EXIT_CODE"
            echo "========================================"

            if [ -d "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR" || true

              if [ -f "$ENV_FILE" ] && [ -f "$COMPOSE_FILE" ]; then

                echo ""
                echo "==> Docker Compose status"
                compose ps -a || true

                echo ""
                echo "==> API logs"
                compose logs --tail=150 api || true

                echo ""
                echo "==> Web logs"
                compose logs --tail=150 web || true

                echo ""
                echo "==> PostgreSQL logs"
                compose logs --tail=80 postgres || true

                echo ""
                echo "==> Redis logs"
                compose logs --tail=80 redis || true

              fi
            fi

            echo ""
            echo "Database volumes are preserved."
            echo "Other projects remain untouched."

            exit "$EXIT_CODE"
          }

          trap on_error ERR

          # =================================================
          # START DEPLOY
          # =================================================
          echo ""
          echo "========================================"
          echo "DEPLOY SAT HACH PLATFORM"
          echo "========================================"

          # =================================================
          # CHECK PROJECT DIRECTORY
          # =================================================
          echo ""
          echo "==> Checking project directory"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "Project directory not found:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          cd "$PROJECT_DIR"

          if [ ! -d ".git" ]; then
            echo "Not a Git repository:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          echo "Project: $(pwd)"

          # =================================================
          # UPDATE SOURCE
          # =================================================
          echo ""
          echo "==> Updating source from GitHub"

          git fetch --prune origin "$BRANCH"

          git checkout -B "$BRANCH" "origin/$BRANCH"

          git reset --hard "origin/$BRANCH"

          echo ""
          echo "Current commit:"
          git log -1 --oneline

          # =================================================
          # VALIDATE REQUIRED FILES
          # =================================================
          echo ""
          echo "==> Validating required files"

          for FILE in \
            "$ENV_FILE" \
            "$COMPOSE_FILE" \
            "Dockerfile.server" \
            "package.json" \
            "pnpm-lock.yaml" \
            "pnpm-workspace.yaml"
          do
            if [ ! -f "$FILE" ]; then
              echo "Missing file: $FILE"
              exit 1
            fi
          done

          # =================================================
          # VALIDATE ENVIRONMENT
          # =================================================
          echo ""
          echo "==> Validating environment variables"

          REQUIRED_ENV_VARS="
          DB_USERNAME
          DB_PASSWORD
          DB_DATABASE
          JWT_ACCESS_SECRET
          JWT_REFRESH_SECRET
          SUPER_ADMIN_USERNAME
          SUPER_ADMIN_PASSWORD
          NEXT_PUBLIC_API_URL
          "

          for ENV_NAME in $REQUIRED_ENV_VARS
          do
            if ! grep -q "^${ENV_NAME}=." "$ENV_FILE"; then
              echo "Missing environment variable: $ENV_NAME"
              exit 1
            fi
          done

          echo "Environment variables OK."

          # =================================================
          # VALIDATE DOCKER COMPOSE
          # =================================================
          echo ""
          echo "==> Validating Docker Compose"

          compose config --quiet

          echo "Docker Compose configuration OK."

          # =================================================
          # CHECK REQUIRED SERVICES
          # =================================================
          echo ""
          echo "==> Checking Docker Compose services"

          SERVICES="$(compose --profile tools config --services)"

          for SERVICE in postgres redis migrate api web
          do
            echo "$SERVICES" | grep -qx "$SERVICE" || {
              echo "Missing service: $SERVICE"
              exit 1
            }
          done

          echo "All required services found."

          # =================================================
          # BUILD APPLICATION IMAGE
          # =================================================
          echo ""
          echo "========================================"
          echo "BUILD SAT HACH DOCKER IMAGE"
          echo "========================================"

          compose build api

          echo ""
          echo "Docker image built successfully."

          # =================================================
          # START POSTGRESQL AND REDIS
          # =================================================
          echo ""
          echo "========================================"
          echo "START SAT HACH POSTGRESQL + REDIS"
          echo "========================================"

          compose up -d --wait postgres redis

          echo ""
          echo "==> Infrastructure health"

          for CONTAINER in "$DB_CONTAINER" "$REDIS_CONTAINER"
          do
            STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CONTAINER"
            )"

            echo "$CONTAINER: $STATUS"

            if [ "$STATUS" != "healthy" ]; then
              echo "Container is not healthy: $CONTAINER"
              exit 1
            fi
          done

          # =================================================
          # RUN MIGRATIONS
          # =================================================
          echo ""
          echo "========================================"
          echo "DATABASE MIGRATIONS"
          echo "========================================"

          compose run --rm -T migrate </dev/null

          echo ""
          echo "Database migrations completed."

          # =================================================
          # START API AND WEB
          # =================================================
          echo ""
          echo "========================================"
          echo "START SAT HACH API + WEB"
          echo "========================================"

          compose up -d --no-build api web

          # =================================================
          # HTTP HEALTH CHECK HELPER
          # =================================================
          wait_http() {
            NAME="$1"
            URL="$2"
            CONTAINER="$3"

            echo ""
            echo "==> Waiting for $NAME"
            echo "URL: $URL"

            for ATTEMPT in $(seq 1 45)
            do
              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                "$URL" \
                >/dev/null 2>&1
              then
                echo "$NAME is ready."
                return 0
              fi

              RUNNING="$(
                docker inspect \
                  --format='{{.State.Running}}' \
                  "$CONTAINER" \
                  2>/dev/null || echo false
              )"

              if [ "$RUNNING" != "true" ]; then
                echo "$NAME container stopped."

                docker logs \
                  --tail=150 \
                  "$CONTAINER" || true

                return 1
              fi

              echo "Waiting for $NAME: $ATTEMPT/45"
              sleep 2
            done

            echo "$NAME health check timed out."

            docker logs \
              --tail=150 \
              "$CONTAINER" || true

            return 1
          }

          # =================================================
          # API HEALTH CHECK
          # =================================================
          echo ""
          echo "========================================"
          echo "API HEALTH CHECK"
          echo "========================================"

          wait_http \
            "Sat Hach API" \
            "http://127.0.0.1:${API_PORT}/api/health" \
            "$API_CONTAINER"

          # =================================================
          # WEB HEALTH CHECK
          # =================================================
          echo ""
          echo "========================================"
          echo "WEB HEALTH CHECK"
          echo "========================================"

          wait_http \
            "Sat Hach Web" \
            "http://127.0.0.1:${WEB_PORT}/login" \
            "$WEB_CONTAINER"

          # =================================================
          # FINAL CONTAINER CHECK
          # =================================================
          echo ""
          echo "========================================"
          echo "FINAL CONTAINER CHECK"
          echo "========================================"

          for CONTAINER in \
            "$DB_CONTAINER" \
            "$REDIS_CONTAINER" \
            "$API_CONTAINER" \
            "$WEB_CONTAINER"
          do
            RUNNING="$(
              docker inspect \
                --format='{{.State.Running}}' \
                "$CONTAINER" \
                2>/dev/null || echo false
            )"

            if [ "$RUNNING" != "true" ]; then
              echo "Container not running: $CONTAINER"
              exit 1
            fi

            echo "$CONTAINER: RUNNING"
          done

          # =================================================
          # FINAL STATUS
          # =================================================
          echo ""
          echo "==> Docker Compose status"

          compose ps -a

          # =================================================
          # CLEANUP DANGLING IMAGES
          # =================================================
          echo ""
          echo "==> Cleaning dangling Docker images"

          docker image prune -f

          # =================================================
          # SUCCESS
          # =================================================
          trap - ERR

          echo ""
          echo "========================================"
          echo "SAT HACH DEPLOY SUCCESS"
          echo "========================================"

          echo ""
          echo "Web Admin:"
          echo "http://163.61.182.214:8001"

          echo ""
          echo "Backend API:"
          echo "http://163.61.182.214:8000/api/health"

          REMOTE
